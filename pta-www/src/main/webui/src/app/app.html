<header class="site-header">
  <div class="container">
    <a class="brand" routerLink="/">
      <span class="logo" aria-hidden="true">PT</span>
      <span class="brand-name">PT Agency</span>
    </a>

    <nav class="main-nav" aria-label="Main">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Home</a>
      <a routerLink="/sessions" routerLinkActive="is-active" ariaCurrentWhenActive="page">Sessions</a>
      <a routerLink="/shop" routerLinkActive="is-active" ariaCurrentWhenActive="page">Shop</a>
    </nav>

    @if (auth.loaded()) {
      <nav class="account" aria-label="Account">
        @if (auth.me().authenticated) {
          <span class="who">{{ auth.me().name }}</span>
          <a class="sign" href="/logout">Sign out</a>
        } @else {
          <a class="sign is-primary" href="/login">Sign in</a>
        }
      </nav>
    }
  </div>
</header>

<main class="container">
  <router-outlet />
</main>
