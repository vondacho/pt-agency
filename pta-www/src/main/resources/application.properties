# All REST endpoints of pta-www live under /api; Quinoa serves the Angular SPA everywhere else.
quarkus.rest.path=/api

# Angular SPA (src/main/webui), built and served by Quinoa
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.22.3
quarkus.quinoa.build-dir=dist/webui/browser
quarkus.quinoa.enable-spa-routing=true
# Angular 22 tests run on Vitest: override Quinoa's Karma-era default (--browsers=ChromeHeadlessCI)
quarkus.quinoa.package-manager-command.test=run test

# pta-booking is the source of truth for sessions; pta-www only relays read requests.
quarkus.rest-client.booking.url=${PTA_BOOKING_URL:http://localhost:8080}
quarkus.rest-client.booking.connect-timeout=2000
quarkus.rest-client.booking.read-timeout=5000

quarkus.jackson.serialization-inclusion=non-null

quarkus.management.enabled=true
quarkus.management.port=9000
%dev.quarkus.management.port=9001
%dev.quarkus.management.host=localhost

# Run next to pta-booking (8080) in development
%dev.quarkus.http.port=8081
%test.quarkus.http.test-port=0
