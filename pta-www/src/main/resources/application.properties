# All REST endpoints of pta-www live under /api; Quinoa serves the Angular SPA everywhere else.
quarkus.rest.path=/api

# Angular SPA (src/main/webui), built and served by Quinoa
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.22.3
quarkus.quinoa.build-dir=dist/webui/browser
quarkus.quinoa.enable-spa-routing=true
# server-side paths the SPA must not shadow (the REST root and /q are ignored by default)
quarkus.quinoa.ignored-path-prefixes=/api,/q,/login,/logout
# Angular 22 tests run on Vitest: override Quinoa's Karma-era default (--browsers=ChromeHeadlessCI)
quarkus.quinoa.package-manager-command.test=run test

# pta-booking is the source of truth for sessions; pta-www only relays read requests.
quarkus.rest-client.booking.url=${PTA_BOOKING_URL:http://localhost:8080}
quarkus.rest-client.booking.connect-timeout=2000
quarkus.rest-client.booking.read-timeout=5000
# pta-customer (profile, subscriptions, requests) and pta-shopping (catalogue)
quarkus.rest-client.customer.url=${PTA_CUSTOMER_URL:http://localhost:8082}
quarkus.rest-client.customer.connect-timeout=2000
quarkus.rest-client.customer.read-timeout=5000
quarkus.rest-client.shopping.url=${PTA_SHOPPING_URL:http://localhost:8083}
quarkus.rest-client.shopping.connect-timeout=2000
quarkus.rest-client.shopping.read-timeout=5000

quarkus.jackson.serialization-inclusion=non-null

quarkus.management.enabled=true
quarkus.management.port=9000
%dev.quarkus.management.port=9001
%dev.quarkus.management.host=localhost

# Run next to pta-booking (8080) in development
%dev.quarkus.http.port=8081
%test.quarkus.http.test-port=0
%test.quarkus.management.test-port=0

# Sign-in: OpenID Connect authorization code flow (pta-www is a confidential client; tokens stay on the server,
# the browser only holds an encrypted session cookie). The participant is the token's `customer_id` claim.
quarkus.oidc.application-type=web-app
quarkus.oidc.client-id=pta-www
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.restore-path-after-redirect=false
quarkus.oidc.authentication.redirect-path=/login
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/
quarkus.http.auth.permission.sign-in.paths=/login,/logout
quarkus.http.auth.permission.sign-in.policy=authenticated
%prod.quarkus.oidc.auth-server-url=${PTA_OIDC_URL}
%prod.quarkus.oidc.credentials.secret=${PTA_OIDC_SECRET}
%prod.quarkus.oidc.authentication.cookie-force-secure=true
# Development: Keycloak Dev Service with the `pta` realm (users alice, bob, carol; test credentials in the realm file)
%dev.quarkus.keycloak.devservices.realm-path=keycloak/pta-realm.json
%dev.quarkus.keycloak.devservices.realm-name=pta
%dev.quarkus.keycloak.devservices.port=8180
%dev.quarkus.oidc.credentials.secret=LVHXxYfVAv67jHYXHmtaI5nIROxoIHBS
# Tests use @TestSecurity identities, no identity provider
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
