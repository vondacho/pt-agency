# Local development: PostgreSQL from Dev Services (a container started automatically) with seeded customers.
# For the managed database, add the `do` profile (see application-do.yaml).
quarkus:
  http:
    port: 8082
  management:
    host: localhost
    port: 9002
  smallrye-openapi:
    info-title: Customer API (development)
  flyway:
    locations: db/migration,db/dev
