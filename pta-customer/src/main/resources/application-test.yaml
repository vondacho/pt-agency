quarkus:
  # Random test ports: tests can run next to the dev stack
  http:
    test-port: 0
  management:
    test-port: 0
  log:
    level: INFO
    category:
      org.hibernate.sql: DEBUG
  hibernate-orm:
    log:
      sql: true
  # pta-shopping is stubbed by the WireMock Dev Service
  rest-client:
    shopping:
      url: http://localhost:${quarkus.wiremock.devservices.port}
  # Tests run the real Flyway migrations and the seed data
  flyway:
    locations: db/migration,db/dev
