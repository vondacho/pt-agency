quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=20.10.0

quarkus.swagger-ui.always-include=true

quarkus.smallrye-openapi.info-title=Booking API
%dev.quarkus.smallrye-openapi.info-title=Booking API (development)
%test.quarkus.smallrye-openapi.info-title=Booking API (test)
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Booking API
quarkus.smallrye-openapi.info-terms-of-service=Your terms here
quarkus.smallrye-openapi.info-contact-email=techsupport@ptagency.ch
quarkus.smallrye-openapi.info-contact-name=Example API Support
quarkus.smallrye-openapi.info-contact-url=https://ptagency.ch/contact
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html
quarkus.smallrye-openapi.store-schema-directory=./doc

quarkus.management.enabled=true
%dev.quarkus.management.host=localhost
quarkus.management.port=9000

quarkus.jackson.serialization-inclusion=non-null

# Persistence: PostgreSQL, schema managed by Flyway.
# Dev and test run against Dev Services (a container started automatically), production reads the datasource from the environment.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-migration-naming=true
%dev.quarkus.flyway.locations=db/migration,db/dev
%test.quarkus.flyway.locations=db/migration,db/dev
%prod.quarkus.datasource.username=${PTA_BOOKING_DB_USERNAME}
%prod.quarkus.datasource.password=${PTA_BOOKING_DB_PASSWORD}
%prod.quarkus.datasource.reactive.url=${PTA_BOOKING_DB_REACTIVE_URL}
%prod.quarkus.datasource.jdbc.url=${PTA_BOOKING_DB_JDBC_URL}

# CORS: only needed when the pta-www SPA is served outside Quinoa (e.g. ng serve); pta-www proxies the API otherwise.
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:4200,http://localhost:8081
