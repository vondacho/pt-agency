name: ci-common

on:
  push:
    paths:
      - 'pta-common/**'
      - 'pta-quarkus-parent/**'
    tags:
      - 'v*.*.*-pta-common'
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'pta-common/pom.xml'

      - name: Build with Maven
        run: mvn -B package --file pta-common/pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish parent POM to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, 'pta-common')
        # consumers resolving pta-common from the registry need its parent there too; skip if this version exists already
        run: |
          version=$(mvn -B -q -N help:evaluate -Dexpression=project.version -DforceStdout --file pta-quarkus-parent/pom.xml)
          if mvn -B -q dependency:get -Dartifact=ch.obya:pta-quarkus-parent:${version}:pom -Dtransitive=false -DremoteRepositories=github::default::https://maven.pkg.github.com/vondacho/pt-agency >/dev/null 2>&1; then
            echo "pta-quarkus-parent ${version} already published"
          else
            mvn -B -N deploy --file pta-quarkus-parent/pom.xml
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, 'pta-common')
        run: mvn -B deploy --file pta-common/pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
